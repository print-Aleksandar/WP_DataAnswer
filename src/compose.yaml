version: "3.9"

services:
  vllm:
    build:
      context: vllm
      dockerfile: Dockerfile.vllm-cpu
    environment:
      - MODEL_NAME=${MODEL_NAME}
      - VLLM_CPU_OMP_THREADS_BIND=0-7
      - VLLM_CPU_KVCACHE_SPACE=2
      - HF_TOKEN=${HF_TOKEN}
    shm_size: '8gb'
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - services_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 3m
    
  llm-service:
    build:
      context: vllm
    environment:
      - VLLM_URL=http://src-vllm-1:8000
      - TOOL_SERVICE_URLS=http://src-rag-service-1:7000,http://src-aggregate-service-1:7100
      - MODEL_NAME=${MODEL_NAME}
    ports:
      - "9999:9999"
    networks:
      - services_net
    depends_on:
      vllm:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      aggregate-service:
        condition: service_healthy


  rag-service:
    build:
      context: RAG
    environment:
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - "7000:7000"
    volumes:
      - rag_storage:/app/storage
    networks:
      - services_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  aggregate-service:
    build:
      context: AggregationMicroservice
    ports:
      - "7100:7100"
    networks:
      - services_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7100/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s  

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wp_dataanswer
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - services_net

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API port (Spring Boot connects here)
      - "9001:9001"   # Web UI port (browser)
    volumes:
      - minio_data:/data
    networks:
      - services_net

networks:
  services_net:
    driver: bridge

volumes:
  huggingface_cache:
  rag_storage:
  db_data:
  minio_data:
