<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Server Tester</title>
  <style>
    :root {
      --bg:        #f5f6f8;
      --surface:   #ffffff;
      --border:    #dde1e9;
      --accent:    #0a8f5c;
      --accent-dim:#d4f0e5;
      --user-bg:   #eef1f7;
      --bot-bg:    #f0faf5;
      --text:      #1a1e2a;
      --muted:     #8891a8;
      --danger:    #d92f4b; 
      --font-mono: 'Courier New', Courier, monospace;
      --font-ui:   Georgia, 'Times New Roman', serif;
      --radius:    6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.online  { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .status-dot.error   { background: var(--danger);  box-shadow: 0 0 6px var(--danger); }

    header h1 {
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: normal;
      letter-spacing: 0.04em;
      color: var(--accent);
      flex: 1;
    }

    .endpoint-badge {
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3px 8px;
      letter-spacing: 0.02em;
    }

    .clear-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: var(--radius);
      padding: 4px 10px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .clear-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Chat history ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      user-select: none;
    }
    .empty-state .symbol {
      font-size: 36px;
      margin-bottom: 12px;
      opacity: 0.3;
    }
    .empty-state p { font-size: 13px; line-height: 1.7; }

    /* ── Message bubbles ── */
    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 820px;
      width: 100%;
      animation: fadeUp 0.18s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot  { align-self: flex-start; align-items: flex-start; }

    .msg-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      padding: 0 4px;
    }
    .msg.user .msg-label { color: color-mix(in srgb, var(--accent) 60%, transparent); }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid transparent;
    }
    .msg.user .msg-bubble {
      background: var(--user-bg);
      border-color: var(--border);
    }
    .msg.bot .msg-bubble {
      background: var(--bot-bg);
      border-color: var(--accent-dim);
      border-left: 2px solid var(--accent);
    }
    .msg.error .msg-bubble {
      background: #1a0d10;
      border-color: var(--danger);
      border-left: 2px solid var(--danger);
      color: #ff8fa0;
    }

    /* ── Typing indicator ── */
    .typing-bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 16px;
    }
    .typing-bubble span {
      display: block;
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1); }
    }

    /* ── Input bar ── */
    footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 14px 20px;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 860px;
      margin: 0 auto;
    }

    textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 10px 14px;
      border-radius: var(--radius);
      resize: none;
      line-height: 1.6;
      min-height: 42px;
      max-height: 180px;
      overflow-y: auto;
      transition: border-color 0.2s;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      color: #030f08;
      border: none;
      border-radius: var(--radius);
      padding: 10px 18px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.05em;
      cursor: pointer;
      flex-shrink: 0;
      height: 42px;
      transition: opacity 0.2s, transform 0.1s;
    }
    #send-btn:hover:not(:disabled) { opacity: 0.85; }
    #send-btn:active:not(:disabled) { transform: scale(0.97); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

<header>
  <div class="status-dot" id="status-dot"></div>
  <h1>LLM Server Tester</h1>
  <span class="endpoint-badge" id="endpoint-label">localhost:9999</span>
  <button class="clear-btn" onclick="clearHistory()">clear</button>
</header>

<div id="chat">
  <div class="empty-state" id="empty-state">
    <div class="symbol">⬡</div>
    <p>Send a prompt to begin.<br>Responses stream from <code>localhost:9999/ask</code>.</p>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea
      id="prompt-input"
      placeholder="Enter a prompt…"
      rows="1"
      autofocus
    ></textarea>
    <button id="send-btn" onclick="sendPrompt()">Send</button>
  </div>
  <p class="hint">Enter ↵ to send &nbsp;·&nbsp; Shift+Enter for newline</p>
</footer>

<script>
  const BASE_URL = 'http://localhost:9999/ask';

  const chatEl    = document.getElementById('chat');
  const inputEl   = document.getElementById('prompt-input');
  const sendBtn   = document.getElementById('send-btn');
  const statusDot = document.getElementById('status-dot');
  const emptyState = document.getElementById('empty-state');

  let busy = false;

  /* ── Auto-grow textarea ── */
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
  });

  /* ── Enter to send ── */
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!busy) sendPrompt();
    }
  });

  function setStatus(state) {
    statusDot.className = 'status-dot ' + (state || '');
  }

  function appendMessage(role, text, isError = false) {
    emptyState && emptyState.remove();

    const wrapper = document.createElement('div');
    wrapper.className = 'msg ' + (isError ? 'error' : role);

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'you' : (isError ? 'error' : 'assistant');

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    chatEl.appendChild(wrapper);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function appendTyping() {
    const wrapper = document.createElement('div');
    wrapper.className = 'msg bot';
    wrapper.id = 'typing-indicator';

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'assistant';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble typing-bubble';
    bubble.innerHTML = '<span></span><span></span><span></span>';

    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    chatEl.appendChild(wrapper);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrapper;
  }

  function removeTyping() {
    document.getElementById('typing-indicator')?.remove();
  }

  async function sendPrompt() {
    const prompt = inputEl.value.trim();
    if (!prompt || busy) return;

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    setStatus('');

    appendMessage('user', prompt);
    const typingEl = appendTyping();

    const url = `${BASE_URL}?prompt=${encodeURIComponent(prompt)}`;

    try {
      const res = await fetch(url, { method: 'GET' });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status} ${res.statusText}`);
      }

      const text = (await res.json()).response;
      removeTyping();
      appendMessage('bot', text || '(empty response)');
      setStatus('online');
    } catch (err) {
      removeTyping();
      const msg = err.name === 'TypeError'
        ? `Cannot reach server at ${BASE_URL}\n\nMake sure the LLM server is running.`
        : err.message;
      appendMessage('bot', msg, true);
      setStatus('error');
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  function clearHistory() {
    chatEl.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.id = 'empty-state';
    empty.innerHTML = `<div class="symbol">⬡</div><p>Send a prompt to begin.<br>Responses stream from <code>${BASE_URL}</code>.</p>`;
    chatEl.appendChild(empty);
    setStatus('');
    inputEl.focus();
  }
</script>

</body>
</html>
