<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>DataAnswering</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/e59232f0a1.js" crossorigin="anonymous"></script>
    <script type="module" src="https://md-block.verou.me/md-block.js"></script>

    <style>
        :root {
            --dark-1: #131313;
            --dark-2: #2a2a2a;
            --dark-3: #333333;
            --gray-1: #444444;
            --gray-2: #888888;
            --gray-3: #a4a4a4;
            --light-1: #E0E0E0;
            --red-1:   #ff6b6b;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--dark-1);
        }

        .page-center {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--dark-1);
        }

        .page-heading {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--light-1);
            margin-bottom: 4px;
            text-align: center;
        }

        .page-sub {
            font-size: 13px;
            color: var(--gray-3);
            margin-bottom: 24px;
            text-align: center;
        }

        .header-title {
            font-size: 14px;
            padding: 10px 0;
            color: var(--light-1);
            font-weight: 600;
        }

        .fs-12px  { font-size: 12px !important; }
        .fw-500   { font-weight: 500 !important; }

        .bg-dark-1   { background-color: var(--dark-1) !important; }
        .bg-dark-2   { background-color: var(--dark-2) !important; }
        .bg-dark-3   { background-color: var(--dark-3) !important; }
        .bg-gray-1   { background-color: var(--gray-1) !important; }
        .bg-light-1  { background-color: var(--light-1) !important; }
        .text-light-1{ color: var(--light-1) !important; }
        .text-light-2 { color: var(--light-2) !important; }

        .text-gray-1 { color: var(--gray-1)  !important; }

        .radius-10 { border-radius: 10px !important; }

        .start-card {
            background-color: var(--dark-2);
            border: 1px solid var(--dark-3);
            border-radius: 14px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .prompt-input {
            background-color: var(--dark-1);
            color: var(--light-1);
            border: 1px solid var(--dark-3);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.15s;
        }

        .prompt-input:focus {
            border-color: var(--gray-2);
            background-color: var(--dark-1);
            color: var(--light-1);
            box-shadow: none;
        }

        .prompt-input::placeholder { color: var(--gray-2); }

        .prompt-input:disabled {
            background-color: var(--dark-3);
            color: var(--gray-2);
            border-color: var(--dark-3);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .upload-input {
            background-color: var(--dark-2);
            border: 1px solid var(--dark-3);
            border-radius: 10px;
            color: var(--light-1);
            font-size: 14px;
            padding: 8px 12px;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .upload-input:hover,
        .upload-input:focus { background-color: var(--dark-3); border-color: var(--gray-2); }

        input[type="file"]::-webkit-file-upload-button {
            background-color: var(--gray-1);
            color: var(--light-1);
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            margin-right: 8px;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        input[type="file"]::-webkit-file-upload-button:hover {
            background-color: var(--gray-2);
        }



        .submit-btn {
            background-color: var(--gray-1);
            color: var(--light-1);
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .submit-btn:hover {
            background-color: var(--gray-2);
        }

        .gray-button {
            background-color: var(--gray-1) !important;
            color: var(--light-1) !important;
            border: none !important;
            border-radius: 10px;
            padding: 8px 16px !important;
            font-size: 13px !important;
            line-height: 1.2;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        

        .btn-custom:hover        { background-color: var(--gray-2) !important; }
        .link-custom:hover       { background-color: var(--gray-2) !important; border-radius: 10px; text-decoration: none; }

        button[type='submit']:disabled {
            background-color: var(--dark-3) !important;
            border-color:     var(--dark-3) !important;
            color: var(--gray-2);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .inline-error {
            font-size: 12px;
            color: var(--red-1);
            text-align: center;
            min-height: 18px;
            margin: 0;
        }

        .error-text { color: var(--red-1); font-size: 13px; }

        .loader {
            --size: 1.5rem;
            width:  var(--size);
            height: var(--size);
            background: var(--light-1);
            display: block;
            animation: rotate 1s linear infinite;
            animation-play-state: paused;
            flex-shrink: 0;
        }

        .loader.running   { animation-play-state: running; }
        .loader.invisible { visibility: hidden; }

        @keyframes rotate {
            0%   { transform: rotate(0deg)   scale(0.2); border-radius: 10%; }
            50%  { transform: rotate(180deg) scale(1.5); border-radius: 50%; }
            100% { transform: rotate(360deg) scale(0.2); border-radius: 10%; }
        }

        ::-webkit-scrollbar       { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--dark-1); }
        ::-webkit-scrollbar-thumb { background-color: var(--gray-1); border-radius: 10px; }

        .new-chat-button { margin-right: 10px; }

        .btn-cancel-sub {
            background-color: var(--red-1);
            color: var(--dark-1);
            border: none;
            transition: filter 0.2s ease-in-out;
        }

        .btn-cancel-sub:hover { filter: brightness(0.85); color: var(--dark-1); }

        .placehodlerCustom::placeholder { color: var(--light-1); }
        
        .tool-display {
            overflow: hidden;
            /*max-height: 0;*/
            opacity: 0;
            transform: translateY(8px);
            transition: 
                /*max-height 250ms ease,*/
                opacity 200ms ease,
                transform 200ms ease;
        }
        .tool-display.visible {
            /*max-height: 60px;*/
            opacity: 1;
            transform: translateY(0);
        }

        .chat-title-loading {
            --_default-color: var(--dark-2);
            --_shimmer-color: var(--gray-1);


            opacity: 0.8;
            background: linear-gradient(
                100deg,
                var(--_default-color),
                var(--_default-color) 45%,
                var(--_shimmer-color) 60%,
                var(--_default-color) 75%
            );
            background-size: 200% 100%;

            animation: skeleton-shimmer 2s ease-out infinite;

            color: transparent !important;
            
            border-radius: 1em;
        }

        @keyframes skeleton-shimmer {
            0% { background-position-x: 200%; }
            100% { background-position-x: 0%; }
        }


    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row" style="height: 100vh; overflow: hidden;">
        <div class="sidebar" th:replace="~{fragments/sidebar}"></div>
        <section class="main" th:replace="~{${bodyContent}}"></section>
    </div>
</div>
</body>
</html>
