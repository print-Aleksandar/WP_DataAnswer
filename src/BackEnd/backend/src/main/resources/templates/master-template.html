    <style>
        :root {
                /* Override core theme colors */
                --dark-1: #131313;
                --dark-2: #2a2a2a;
                --dark-3: #333333;

                --gray-1: #444444;
                --gray-2: #888888;

                --light-1: #E0E0E0;

                --red-1: #ff6b6b;
                
        }

        .btn-custom:hover{
                background-color: var(--gray-2) !important;   
        }
        .link-custom:hover{
                background-color: var(--gray-2) !important;
                border-radius: 10px;
                text-decoration: none;
        }
        input[type="file"]::-webkit-file-upload-button {
          background-color: var(--gray-1);
          color: var(--light-1);
          border: none;
          border-radius: 8px;
          padding: 5px 10px;
          margin-left: 1px;
          cursor: pointer;
        }


        .placehodlerCustom::placeholder {
                color: var(--light-1);
        }
        .sidebar-chats::-webkit-scrollbar, 
        ::-webkit-scrollbar  {
                width: 4px;
        }
        .sidebar-chats::-webkit-scrollbar-track, 
        ::-webkit-scrollbar-track {
                background: var(--dark-1);
        }
        .sidebar-chats::-webkit-scrollbar-thumb,
        ::-webkit-scrollbar-thumb  {
                background-color: var(--gray-1);
                border-radius: 10px;
        }

        .bg-dark-1 {
                background-color: var(--dark-1) !important;
        }
        .text-light-1 {
                color: var(--light-1) !important;
        }
        .text-gray-1 {
                color: var(--gray-1) !important;
        }
        .bg-gray-1 {
                background-color: var(--gray-1) !important;
        }
        .bg-light-1 {
                background-color: var(--light-1) !important;

        }
        .radius-10 {
                border-radius: 10px !important;
        }

        .fs-12px {
                font-size: 12px !important;
        }

        .header-title {
                font-size: 14px; 
                padding: 10px; 
                color: var(--light-1) !important;
        }

        .gray-button {
                background-color: var(--gray-1) !important; 
                height: 35px; 
                border-color: var(--gray-1) !important; 
        }

        .upload-input {
                background-color: var(--dark-2);    

                border-color: var(--dark-3);  
                color: var(--light-1); 
        }

        .upload-input:focus::-webkit-file-upload-button, 
        .upload-input:hover::-webkit-file-upload-button {
                background-color: var(--gray-2) !important;
                color: var(--light-1);
        }

        .error-text {
                color: var(--red-1); 
                font-size: 13px;
        }

        .new-chat-button {
                margin-right: 10px; 
        }
  </style>

<body>
<div class="container-fluid">
   <div class="row" style="height: 100vh;">
      <div class="sidebar" th:replace="~{fragments/sidebar}"></div>

      <section class="main" th:replace="~{${bodyContent}}"></section>

   </div>
</div>

</body>
