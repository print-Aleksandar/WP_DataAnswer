            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"

    <script src="https://kit.fontawesome.com/e59232f0a1.js" crossorigin="anonymous"></script>

    <style>
        .btn-custom:hover{
                background-color: #888888 !important;   
        }
        .link-custom:hover{
                background-color: #888888 !important;
                border-radius: 10px;
                text-decoration: none;
        }
        input[type="file"]::-webkit-file-upload-button {
          background-color: #444444;
          color: #E0E0E0;
          border: none;
          border-radius: 8px;
          padding: 5px 10px;
          margin-left: 1px;
          cursor: pointer;
      }
      .placehodlerCustom::placeholder {
          color: #E0E0E0;
      }
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
        .sidebar-chats::-webkit-scrollbar {
                width: 4px;
        }
        .sidebar-chats::-webkit-scrollbar-track {
                background: #131313;
        }
        .sidebar-chats::-webkit-scrollbar-thumb {
                background-color: #444444;
                border-radius: 10px;
        }
        </style>  
</head>
<body>

<header th:replace="~{fragments/headerChat}"></header>

<section class="main" th:replace="~{${bodyContent}}"></section>
