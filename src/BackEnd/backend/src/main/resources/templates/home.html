<body xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div sec:authorize="isAnonymous()" 
         class="d-flex justify-content-center align-items-center" 
         style="min-height: 80vh;">
        <div class="bg-white shadow p-5" 
             style="border-radius: 20px; width: 500px;">

            <h3 class="mb-3 text-center">Welcome to Answering</h3>

            <div class="p-3 mb-3" 
                 style="border-radius: 15px; background-color: #f1f3f5;">
                <input type="text" class="form-control border-0 bg-transparent"
                       placeholder="Ask something...">
            </div>

            <div class="text-center">
                <a href="/login" class="btn btn-primary px-4">
                    Upload File
                </a>
            </div>

        </div>
    </div>

    <div sec:authorize="isAuthenticated()" class="d-flex" style="height: 90vh;">

        <div class="bg-dark text-white p-3" style="width: 250px; overflow-y: auto;">
            <h5 class="mb-3">Your Chats</h5>

            <ul class="list-unstyled">
                <li th:each="chat : ${chats}" class="mb-2">
                    <a th:href="@{/chat/{id}(id=${chat.id})}"
                       th:text="${chat.chatName}"
                       class="d-block p-2 bg-secondary rounded text-white text-decoration-none">
                    </a>
                </li>
                <li th:if="${#lists.isEmpty(chats)}" class="text-muted small">
                    No chats yet
                </li>
            </ul>

            <form th:action="@{/chat/create}" method="post" class="mt-3">
                <input type="text" name="chatName" class="form-control mb-2"
                       placeholder="Chat name...">
                <button type="submit" class="btn btn-outline-light w-100">
                    + New Chat
                </button>
            </form>
        </div>

        <div class="flex-grow-1 d-flex flex-column justify-content-center align-items-center">
            <div style="width: 600px;" class="text-center">
                <h3 class="mb-3">Start a conversation</h3>
                <p class="text-muted">Create a new chat or select one from the sidebar</p>
            </div>
        </div>

    </div> 

</body>
