<div class="d-flex justify-content-end mb-2" th:fragment="userMessage(text)">
    <div class="p-3 radius-10 text-light-1 fs-6  bg-dark-3"
            style="max-width: 80%;">
        <span class="prompt-content" th:text="${text}"></span> 
    </div>
</div>


<div class="d-flex flex-column" th:fragment="assistantMessage(text)">
    <div class="ms-5 ps-4 tool-display"></div>
    <div class="d-flex justify-content-start align-items-start gap-3">
        <div class="mt-3">
            <span class="loader invisible"></span>
        </div>
        <div class="p-3 radius-10 text-light-1 bg-dark-2"
            style="border: 1px solid var(--dark-3); max-width: 80%;">
            <md-block class="md-content">
                [[${text}]]
            </md-block>
        </div>
    </div>
</div>
