<div xmlns:th="http://www.thymeleaf.org" class="d-flex" style="height: 100vh;">

    <div class="bg-dark text-white p-3" style="width: 250px; overflow-y: auto;">
        <h5 class="mb-3">Your Chats</h5>

        <ul class="list-unstyled">
            <li th:each="c : ${chats}" class="mb-2">
                <a th:href="@{/chat/{id}(id=${c.id})}"
                   th:text="${c.chatName}"
                   class="d-block p-2 rounded text-white text-decoration-none"
                   th:classappend="${c.id == chat.id} ? 'bg-primary' : 'bg-secondary'">
                </a>
            </li>
            <li th:if="${#lists.isEmpty(chats)}" class="text-muted small">
                No chats yet
            </li>
        </ul>

        <form th:action="@{/chat/create}" method="post" class="mt-3">
            <input type="text" name="chatName" class="form-control mb-2"
                   placeholder="Chat name...">
            <button type="submit" class="btn btn-outline-light w-100">
                + New Chat
            </button>
        </form>
    </div>

    <div class="flex-grow-1 d-flex flex-column" style="overflow: hidden;">

        <div class="p-3 border-bottom fw-bold fs-5" th:text="${chat.chatName}"></div>

        <div class="flex-grow-1 p-4" style="overflow-y: auto;">

            <div th:if="${#lists.isEmpty(messages)}" 
            class="text-center text-muted mt-5">
                <p>No messages yet.</p>
            </div>

            <div th:each="msg : ${messages}" 
                class="mb-4 mx-auto" style="max-width: 700px;">

                <div th:if="${!#lists.isEmpty(msg.files)}"
                    class="d-flex align-items-center gap-2 mb-2 p-2 bg-white rounded shadow-sm">
                    <span th:each="f : ${msg.files}" 
                        class="badge bg-light text-dark border me-1 p-2"
                        th:text="${f.fileName}">
                    </span>
                </div>

                <div class="d-flex justify-content-end mb-2">
                    <div class="p-3 rounded text-white" 
                        style="background-color: #0b1f3a; max-width: 80%;">
                        <span th:text="${msg.question}"></span>
                    </div>
                </div>

                <div class="d-flex justify-content-start">
                    <div class="p-3 rounded bg-white shadow-sm" style="max-width: 80%;">
                        
                        <span th:if="${msg.answer != null}" 
                            th:text="${msg.answer}">
                        </span>

                        <span th:if="${msg.answer == null}" 
                            class="text-muted fst-italic">
                                Waiting for answer...
                        </span>

                    </div>
                </div>

                </div>
        </div>

        <div class="p-3 border-top bg-light">
            <form th:action="@{/chat/{chatId}/message(chatId=${chat.id})}"
                method="post"
                enctype="multipart/form-data"
                class="d-flex flex-column gap-2">

                <!-- File upload — optional, not required -->
                 <span class="mb-2 d-block fs-6" id="upload-status" hidden></span>
                <input type="file" name="file" class="form-control" id="file-input"
                    th:accept="${supportedFileTypes}">

                <div class="d-flex gap-2">
                    <input type="text" name="question"
                        class="form-control"
                        placeholder="Type your question...">
                    <button type="submit" class="btn btn-primary px-4">Send</button>
                </div>

            </form>

            <script th:inline="javascript">
                document.addEventListener('DOMContentLoaded', () => {
                    document.querySelector("#file-input")
                    .addEventListener('change', async (e) => {
                        console.log("UPLOADING")
                        const files = e.target.files;
                        if (!files.length || files.length == 0) return;

                        const formData = new FormData();
                        formData.append('file', files[0]);

                        formData.append('chatId', [[${chat.id}]])

                        setStatus('uploading');

                        try {
                            const response = await fetch('/upload', {
                                method: 'POST',
                                contentType: 'multipart/form-data',
                                body: formData
                            });

                            if (!response.status != 200) throw new Error(`Server error: ${response.status}`);

                            setStatus('success', 'uploaded successful.');
                        } catch (err) {
                            setStatus('error', 'File upload failed. Please try again.');
                        }
                    });
                });
                
                function setStatus(state, message = '') {
                    const span = document.getElementById('upload-status');
                    span.textContent = message;
                    span.className = '';
                    span.hidden = state != 'success' || !message;

                    if (state === 'error') span.classList.add('upload-error');
                    if (state === 'success') span.classList.add('upload-success');
                }
            </script>
        </div>

    </div>

</div>
